version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: daily
      time: '20:00'
    open-pull-requests-limit: 15
    cooldown:
      default-days: 3
    ignore:
      # Pinned to keep the current look (4.6.2 changes typography, 5.x is a redesign)
      - dependency-name: bootstrap
    groups:
      vite:
        patterns:
          - vite
          - vitest
          - '@vitest/*'
          - '@vitejs/*'
      vue:
        patterns:
          - vue
          - vue-tsc
          - '@vue/*'
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns:
          - '*'
